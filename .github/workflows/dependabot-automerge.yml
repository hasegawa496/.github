# GENERATED: scripts/sync-workflow-callers.sh により生成
# Dependabot 自動マージ（配布先へコピーして使う workflow）
#
# 使い方:
#   1) `templates/` の配布処理で各リポジトリの
#      `.github/workflows/dependabot-automerge.yml` として配置する
#   2) 発火用の監視対象は全リポジトリで `CI` に固定する
#
# 対象:
#   - dependabot が作成した PR について、head SHA 上のすべてのチェックが
#     完結し、すべて成功の場合だけ、patch / minor / major の区別なくマージする
#   - マージ可否の判定は Reusable Workflow 側の全チェック確認が担う

name: Dependabot Auto-merge

on:
  # dangerous-triggers の無視理由: CI 完了を契機にマージ可否を判定する設計である（ADR 0003）。
  # 受け取るのは head SHA だけで、fork が作る成果物やイベント本文の内容は信用して使わない。
  # jactionlint ignore=dangerous-triggers
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# 権限はジョブ側で付与する。
permissions: {}

# 同じブランチで CI が続けて完了したときは、新しい実行だけが判定する。
concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  automerge:
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: ./.github/workflows/dependabot-automerge-reusable.yml
