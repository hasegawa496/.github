# このリポジトリ固有の CI。templates/.github/workflows/ci.yml から自動生成しない。
# ci.yml は実検証を含みリポジトリ固有になるため（ADR 0003 決定7）、
# scripts/sync-workflow-callers.sh は name: CI を持つこのファイルを検出すると
# 上書き生成をスキップする。変更する場合はこのファイルを直接編集する。
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./actions/shellcheck
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check workflow templates
        run: scripts/check-workflow-templates.sh
      - uses: ./actions/hk-check
        if: github.event_name == 'pull_request'
        with:
          tools: hk@2.13.0 jactionlint@2.5.0 yamllint@1.38.0 shellcheck@0.11.0 shfmt@3.14.1 typos@1.52.2 gitleaks@8.30.1 rumdl@0.3.5 biome@2.6.8
