# Issue 作成/編集時に Project へ自動追加し、優先度/Size を自動設定します
#
# 使い方:
#   1) このファイルを各リポジトリの `.github/workflows/triage.yml` へコピーして push
#   2) リポジトリの Secrets に以下を設定
#        - PROJECT_TOKEN: Projects v2 を更新できるトークン（PAT など）
#   3) Projects v2 側にフィールドを作成（名前を揃える）
#        - Priority（Single select）
#        - Size（Single select: XS/S/M/L/XL）

name: Triage

on:
  issues:
    # reopened は含めない。本文が変わらないため、アサインは opened 限定で対象外、
    # Project は既存 item を再利用、優先度/Size は同じ値の書き直しとなり、
    # 何も変わらないまま1分課金されるだけである。
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    uses: hasegawa496/.github/.github/workflows/triage-reusable.yml@main
    with:
      project_number: 12
      # project_owner: hasegawa496
      # priority_field_name: Priority
      # size_field_name: Size
    secrets:
      project_token: ${{ secrets.PROJECT_TOKEN }}
