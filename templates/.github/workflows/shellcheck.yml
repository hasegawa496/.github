# ShellCheck（配布先へコピーして使う workflow）
#
# 推奨:
#   - このファイルを対象リポジトリの `.github/workflows/shellcheck.yml` としてコピーしてください。

name: ShellCheck

on:
  pull_request:
    paths:
      - '**/*.sh'
      - '.github/workflows/shellcheck.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.sh'
      - '.github/workflows/shellcheck.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    uses: hasegawa496/.github/.github/workflows/shellcheck-reusable.yml@main
