# CI が未整備のリポジトリ用の標準 workflow。
# 既に name: CI を持つ workflow がある場合は配布しない。
# 最低限 ShellCheck を実行しつつ、Dependabot Auto-merge の workflow_run を
# 必ず発火させるトリガーも兼ねる（docs/reusable-workflows/ci.md）。
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # 軽量ジョブのため ubuntu-slim を使用。
    # 実行時間が継続的に 1 分を超える場合は ubuntu-latest への変更を検討する。
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: hasegawa496/.github/actions/shellcheck@main
