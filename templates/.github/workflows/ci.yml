# このリポジトリの標準 CI。PR ごとに実行する検証をこの workflow にまとめる。
# ShellCheck と hk を実行する。リポジトリ固有の検証は steps に追加してよい。
#
# 初期テンプレートは hasegawa496/.github の templates/.github/workflows/ci.yml。
# 配布は name: CI を持つ workflow がないリポジトリへの初回のみで、
# 既存の CI には repos apply が hk の設定を追記する。

# name は変更しない。Dependabot Auto-merge が「CI」という名前の workflow の
# 完了を発火トリガーにしているため、改名すると自動マージが動かなくなる。
# マージ可否は発火後の全チェック確認で決まるので、中身の入れ替えは自由でよい。
name: CI

on:
  pull_request:

permissions:
  contents: read

# 同じ PR の古い実行を、新しい push の実行で置き換える。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # 軽量ジョブのため ubuntu-slim を使用。
    # 実行時間が継続的に 1 分を超える場合は ubuntu-latest への変更を検討する。
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: hasegawa496/.github/actions/shellcheck@main
      - uses: hasegawa496/.github/actions/hk-check@main
        if: github.event_name == 'pull_request'
        with:
          tools: "@HK_CI_TOOLS@"
